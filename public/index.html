{fx:'panel',t:'Solar panel degradation',d:'Solar output dropped 18%.',o:[['Shut down an instrument','Less science, saves power',s=>{s.pm*=.82;s.sm*=.7;s.cut+=80;return'Instrument off. Science down, power stable.'}],['Enter low-power mode','Much less activity, safer',s=>{s.pm*=.82;s.sm*=.6;s.cut+=140;return'Low-power mode holds the battery up.'}],['Continue normally','Risk of battery depletion',s=>{s.pm*=.82;return'Power margin is thinner now.'}]]},
{fx:'meteor',t:'Micrometeoroid warning',d:'23% chance of panel damage (lower with shielding).',o:[['Take the controls','Blast the meteoroids yourself (skill-based)',s=>'__game'],['Rotate to shield the panels','Costs 5 kg fuel, 8% risk',s=>{s.fuel-=5;return Math.random()<.08?(s.pm*=.8,'Rotation failed to help. Panel hit.'):'Panels protected.'}],['Enter safe mode this month','Lose a month of science, no risk',s=>{s.skip=1;return'Rode it out in safe mode.'}],['Ignore it','Gamble',s=>Math.random()<.23-s.sh*.05?(s.pm*=.7,s.h-=15,'Impact. Panel and hull damaged.'):'Nothing hit.']]},
{fx:'flare',t:'Solar flare',d:'Radiation spike, with plasma debris.',o:[['Take the controls','Shoot the plasma debris yourself',s=>'__game'],['Safe mode','Skip science this month',s=>{s.skip=1;return'Safe mode absorbed the flare.'}],['Reboot computer after','Costs some battery',s=>{s.b-=15;s.h-=3;return'Minor glitches, recovered.'}],['Carry on','Radiation damage',s=>{s.h-=14-s.sh*3;return'Electronics took a beating.'}]]},
{fx:'meteor',t:'Debris field',d:'An old rocket stage broke up ahead.',o:[['Take the controls','Shoot the fragments yourself',s=>'__game'],['Fire thrusters to dodge','Costs 15 kg fuel, 10% risk',s=>{s.fuel-=15;return Math.random()<.1?(s.h-=10,'A fragment clipped the hull.'):'Dodged cleanly.'}],['Ignore it','Gamble',s=>Math.random()<.4?(s.pm*=.8,s.h-=12,'Fragments tore into the panels.'):'The debris passed by.']]},
{fx:'comm',t:'Communications dropout',d:'The downlink is unstable.',o:[['Lower data rate','Science x0.9',s=>{s.sm*=.9;s.cp=-1;return'Link stable at lower rate.'}],['Boost antenna power','Uses 15% battery',s=>{s.b-=15;s.cp=0;return'Link restored.'}],['Wait it out','Lose a month of data',s=>{s.skip=1;return'Data lost this month.'}]]}];

function bpDraw(){
 const c=$('bp');if(!c)return;const g=c.getContext('2d'),W=900,H=420,cx=450,cy=225,k=3;
 g.fillStyle='#0a2645';g.fillRect(0,0,W,H);g.strokeStyle='rgba(120,190,255,.13)';g.lineWidth=1;g.beginPath();
 for(let x=0;x<W;x+=30){g.moveTo(x,0);g.lineTo(x,H)}for(let y=0;y<H;y+=30){g.moveTo(0,y);g.lineTo(W,y)}g.stroke();
 drawSat(g,cx,cy,k,false);
 const cc=calc(D),L=[],R=[],n=D.solar,ant=D.ant;
 if(n)L.push([`Solar array: ${n} panels, ${(cc.gen).toFixed(0)} W`,cx-k*(42+Math.max(0,Math.ceil(n/2)-1)*20+10),cy]);
 L.push([`Battery bank: ${D.batt} unit(s)`,cx-k*8,cy+k*6]);
 if(D.shield)L.push([`Radiation shielding: ${D.shield} layer(s)`,cx-k*14,cy-k*10]);
 R.push([`Antenna: ${ant?'large':'small'} (comm ${cc.comm})`,cx,cy-k*(28+ant*8)-k*3]);
 if(D.spec)R.push(['Spectrometer',cx,cy-k*20]);
 if(D.cam)R.push([`Camera: ${INST[0].opts[D.cam][0]}`,cx,cy+k*20]);
 R.push([`Propellant tank: ${D.fuel} kg`,cx+k*10,cy+k*8]);R.push([`Radio: ${BANDS[D.band].n}-band ${MODS[D.mod].n}, ${link(D).rate} Mbps`,cx+k*3,cy-k*(28+ant*8)-k*6]);
 g.font='13px system-ui';g.lineWidth=1;
 [[L,26,'left'],[R,W-26,'right']].forEach(([arr,x,al])=>arr.forEach((a,i)=>{const y=50+i*62;g.strokeStyle='rgba(255,220,120,.8)';g.beginPath();g.moveTo(x+(al=='left'?-4:4),y-5);g.lineTo(a[1],a[2]);g.stroke();g.fillStyle='#ffd777';g.beginPath();g.arc(a[1],a[2],3,0,7);g.fill();g.fillStyle='#e6f2ff';g.textAlign=al;g.fillText(a[0],x,y)}));
 g.textAlign='center';g.fillStyle='#fff';g.font='600 20px system-ui';g.fillText(D.look.name,W/2,32);g.fillStyle='#9fc3e6';g.font='13px system-ui';g.fillText(`Mass ${cc.mass} kg, launch limit ${cc.cap} kg, ${(D.ss?'sun-synchronous':'inclined')} orbit at ${D.alt} km`,W/2,H-16);g.textAlign='left';
}
function finalize(){
 window.__name=($('pn')&&$('pn').value.trim())||window.__name||'Anonymous';
 const c=calc(D),ins=c.ins,b=[['Spacecraft bus ('+BUS[D.bus].n+')',BUS[D.bus].cost],['Fuel tank',TANKS[D.tank].cost],['Solar panels',D.solar*2],['Batteries',D.batt*1.5],['Shielding',D.shield*4],['Propellant',D.fuel*.05],['Camera',ins[0][4]],['Spectrometer',ins[1][4]],['Antenna',ins[2][4]],['Radio transmitter',BANDS[D.band].cost+MODS[D.mod].cost],['Launch vehicle',LV[D.lv].cost]].filter(x=>x[1]>0);
 const tot=c.cost,left=M.budget-tot,over=c.mass>c.cap;
 const opt=(name,obj,cur)=>Object.keys(obj).map(k=>`<label><input type="radio" name="${name}" value="${k}" ${cur==k?'checked':''}> ${k}</label>`).join('');
 $('app').innerHTML=`<div class="card"><h2>Finalize budget and spacecraft design</h2><p class="mu">Check your costs and style your spacecraft. Hardware is locked once you launch.</p></div>
 <div class="grid"><div><canvas id="bp" width="900" height="420" style="width:100%;border-radius:10px;border:1px solid var(--ln);display:block;margin-bottom:14px" aria-label="Spacecraft blueprint"></canvas>
 <div class="card"><h2>Budget breakdown</h2>${b.map(x=>`<div class="row"><span>${x[0]}</span><b class="v">$${x[1].toFixed(1)}M</b><div class="bar" style="grid-column:1/3"><i style="width:${Math.min(100,x[1]/M.budget*100)}%"></i></div></div>`).join('')}
 <div class="row"><b>Total</b><b class="v ${left<0?'bad':''}">$${tot.toFixed(1)}M of $${M.budget}M</b></div>
 <p class="${left<0?'bad':'ok'}">${left<0?'Over budget by $'+(-left).toFixed(1)+'M. Go back and cut costs.':'$'+left.toFixed(1)+'M left over counts toward your budget score.'}</p>${over?'<p class="bad">Spacecraft is too heavy for the launch vehicle.</p>':''}</div></div>
 <aside class="sticky"><div class="card"><h2>Style your spacecraft</h2><label class="mu" for="sn">Name</label>
 <input id="sn" value="${D.look.name}" maxlength="18" style="width:100%;margin:4px 0 10px;padding:10px;border-radius:8px;border:1px solid var(--ln);background:var(--pn);color:var(--tx);font:inherit">
 <p class="mu">Body finish</p><div class="lv">${opt('lb',BODY,D.look.body)}</div><p class="mu">Solar panel type</p><div class="lv">${opt('lp',PAN,D.look.panel)}</div></div>
 <button id="ap" style="width:100%;margin-bottom:8px" ${left<0||over?'disabled':''}>Approve and launch</button><button id="bk" class="alt" style="width:100%">Back to edit</button></aside></div>`;
 $('sn').oninput=e=>{D.look.name=e.target.value.trim()||'Sentinel-1';bpDraw()};
 document.querySelectorAll('input[name=lb]').forEach(r=>r.onchange=e=>{D.look.body=e.target.value;bpDraw()});
 document.querySelectorAll('input[name=lp]').forEach(r=>r.onchange=e=>{D.look.panel=e.target.value;bpDraw()});
 $('ap').onclick=launch;$('bk').onclick=build;bpDraw();
}
function launch(){
 window.__name=($('pn')&&$('pn').value.trim())||window.__name||'Anonymous';
 const c=calc(D),ok=Math.random()<LV[D.lv].rel;
 if(!ok){$('app').innerHTML=CANV+'<div id="sim"></div>';fx={k:'launch',t0:performance.now(),fail:true};startScene();
  setTimeout(()=>{$('sim').innerHTML=`<div class="card"><h2 class="bad">Launch failure</h2><p>The ${LV[D.lv].n} failed (it has a ${+(LV[D.lv].rel*100).toFixed(1)}% success rate). The mission is lost, but a redesign is one click away.</p><button id="rd">Redesign</button></div>`;$('rd').onclick=build},4300);
  return}
 const pool=[...EV].sort(()=>Math.random()-.5);
 S={cp:0,mg:null,c,m:0,b:100,fuel:D.fuel,h:100,sci:0,data:0,pm:1,sm:1,cut:0,skip:0,sh:D.shield,ev:{3:pool[0],6:pool[1],9:pool[2]},log:['Launch successful. Orbit reached at '+D.alt+' km.'],pf:1};
 $('app').innerHTML=CANV+'<div id="sim"><p class="mu">Launching...</p></div>';fx={k:'launch',t0:performance.now()};startScene();setTimeout(()=>{fx={k:'idle'};step()},4300);
}
function tel(){
 const s=S,bar=(n,v)=>`<div><span class="mu">${n}</span> <b class="v">${Math.round(v)}%</b><div class="bar"><i style="width:${clamp(v,0,100)}%;${v<25?'background:var(--bd)':''}"></i></div></div>`;
 return`<div class="card"><h2>Month ${s.m} of ${M.months}</h2><div class="tel">${bar('Battery',s.b)}${bar('Fuel',D.fuel?s.fuel/D.fuel*100:0)}${bar('Health',s.h)}${bar('Power',s.pf*100)}${bar('Mission',s.m/M.months*100)}<div><span class="mu">Data</span> <b class="v">${s.data.toFixed(0)} GB</b></div></div><canvas id="iq" width="320" height="110" style="width:100%;max-width:420px;margin-top:10px;border-radius:8px;background:#06121c" aria-label="Radio signal: constellation and waveform"></canvas><p class="mu">Radio: ${BANDS[D.band].n}-band ${MODS[D.mod].n}, link margin ${s.mg==null?'-':s.mg.toFixed(1)} dB</p></div>`;
}
function step(ev){
 const s=S;s.m++;const c=s.c,o=c.o;
 const gen=c.gen*s.pm,load=Math.max(60,c.load-s.cut);s.pf=clamp(gen/load,0,1);
 s.b=clamp(s.b+(gen-load)/load*12,0,100);
 let pf=s.pf;if(s.b<=0&&gen<load){s.h-=6;s.log.push(`Month ${s.m}: battery empty, brownout (-6 health).`);pf*=.5}
 s.fuel-=o.drag/12;if(s.fuel<0){s.fuel=0;s.h-=4;s.log.push(`Month ${s.m}: out of fuel, orbit decaying (-4 health).`)}
 s.h-=o.rad*(1-.28*s.sh);
 const LK=link(D),fade=D.band==2?-rnd(0,7):D.band==1?-rnd(0,2):0;s.mg=LK.margin+fade+s.cp;const q=s.mg>=3?1:s.mg>=0?.8:s.mg>-4?.4:.1,cm=(.35*c.ins[2][1]+65*MODS[D.mod].rf)*q;
 if(s.mg<0)s.log.push(`Month ${s.m}: link margin ${s.mg.toFixed(1)} dB, packets lost (${fade<-3?'rain fade':'weak link'}).`);
 const gain=s.skip?0:c.sci*s.sm*o.res*(.5+.5*o.cov)*pf*(.6+.4*cm/100)/M.months*1.8;s.skip=0;
 s.sci+=gain;s.data+=gain*3;
 if(s.h<=0){return end()}
 $('sim').innerHTML=tel();
 if(s.ev[s.m]){const e=s.ev[s.m];if(e.fx==='comm')s.cp=-6;
  $('sim').innerHTML+=`<div class="ev"><h2>${e.t}</h2><p>${e.d}</p>${e.o.map((x,i)=>`<button data-i="${i}"><b>${x[0]}</b><br><span class="mu">${x[1]}</span></button>`).join('')}</div>`;
  fx={k:e.fx,phase:'in',t0:performance.now(),title:e.t};
  document.querySelectorAll('.ev button').forEach(b=>b.onclick=()=>{const x=e.o[b.dataset.i],h0=s.h,p0=s.pm;const r=x[2](s);if(r==='__game')return startDefense(e,s);s.log.push(`Month ${s.m}, ${e.t}: ${x[0]}. ${r}`);s.b=clamp(s.b,0,100);
   fx={k:e.fx,phase:'resolve',hit:s.h<h0||s.pm<p0-1e-9,t0:performance.now(),title:e.t};
   $('sim').innerHTML=tel()+`<p class="mu">${r}</p>`;setTimeout(()=>{fx={k:'idle'};next()},1900)});
 }else setTimeout(next,600);
}
function next(){S.m>=M.months?end():step()}
function end(){
 const s=S,sc=Math.round(clamp(s.sci,0,100)),h=Math.round(clamp(s.h,0,100)),left=M.budget-s.c.cost;
 const res=h<=0?'MISSION LOST':sc>=M.req&&h>40?(h>70?'FULL SUCCESS':'SUCCESS, DAMAGED'):sc>=M.req*.6?'PARTIAL SUCCESS':'FAILURE';
 const o=s.c.o,why=[],LK=link(D);why.push(`Radio: ${BANDS[D.band].n}-band ${MODS[D.mod].n} gave a ${LK.rate} Mbps link with ${LK.margin.toFixed(1)} dB design margin at ${D.alt} km.`);
 why.push(`Altitude ${D.alt} km gave ${(o.res*100).toFixed(0)}% sharpness and ${(o.cov*100).toFixed(0)}% coverage.`);
 why.push(`Instruments offered ${s.c.sci} science and comms ${s.c.comm}; the antenna gates how much data gets home.`);
 why.push(`Radiation cost about ${(o.rad*(1-.28*D.shield)*M.months).toFixed(0)} health over the year with ${D.shield} shield layer(s).`);
 $('sim').innerHTML=`<div class="card"><h2>${res}</h2>
 <p>Scientific return <b class="v">${sc} / 100</b> (needed ${M.req}) ${sc>=M.req?'<span class="ok">met</span>':'<span class="bad">missed</span>'}</p>
 <p>Reliability <b class="v">${h} / 100</b></p><p>Battery reserve <b class="v">${Math.round(s.b)}%</b>, fuel left <b class="v">${s.fuel.toFixed(0)} kg</b></p>
 <p>Budget left <b class="v">$${left.toFixed(1)}M</b></p></div>
 <div class="card"><h2>Why?</h2><ul class="log">${why.concat(s.log).map(x=>`<li>${x}</li>`).join('')}</ul></div>
 <button id="rd">Redesign and relaunch</button>`;
 $('rd').onclick=build;
 const box=document.createElement('div');box.id='lb';$('sim').appendChild(box);
 fetch(API+'/api/results',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:window.__name,science:sc,health:h,cost:+s.c.cost.toFixed(1),mass:s.c.mass,result:res})}).then(lb).catch(lb);
}
function lb(){
 fetch(API+'/api/leaderboard').then(r=>r.json()).then(rows=>{const b=$('lb');if(!b)return;
  b.innerHTML='<div class="card"><h2>Leaderboard</h2>'+(rows.length?'<ul class="log">'+rows.map(r=>`<li>${r.name}: science ${r.science}, health ${r.health}, $${r.cost}M, ${r.result}</li>`).join('')+'</ul>':'<p class="mu">No results yet.</p>')+'</div>'}).catch(()=>{const b=$('lb');if(b)b.innerHTML='<p class="mu">Leaderboard offline. Start the backend with npm start and open '+(API||location.origin)+' (or add ?api=http://your-server:3000 to the address).</p>'});
}
build();
</script></body></html>
